[pytest]
# Molde do kit mss-spec (templates/pytest/pytest.ini). Marca a raiz do projeto para o pytest
# carregar o conftest.py da raiz (pasta temporária própria + uma rodada por vez).
testpaths = tests
# Teste parado há mais de 5 minutos: o pytest mostra onde ele está (não interrompe).
faulthandler_timeout = 300
